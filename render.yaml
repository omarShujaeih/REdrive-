# Render Blueprint for the Redrive demo: one web service that builds the React client
# and serves it from the Express API on the same address.
# Without MONGO_URI the API runs an in-memory MongoDB filled with the seed test data
# (reset on every restart). To use Atlas, add MONGO_URI in the Render dashboard.
services:
  - type: web
    name: redrive-demo
    runtime: node
    plan: free
    branch: demo
    autoDeploy: true
    buildCommand: npm ci --prefix client && npm run build --prefix client && npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: SHOW_DEV_CODES
        value: "true"
